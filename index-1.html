<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#faf8f3;--card:#fff;--line:#e8e2d3;--tx:#161616;--mu:#6d675a;--gold:#9a7424;--btn:#c9a24d;--hd:#faf8f3ee;--b1:#fff;--b2:#efe9d9;--bf:#f6f1e3;--sh:#0000000f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root[data-theme=dark]{--bg:#0c0c0c;--card:#161616;--line:#2a2824;--tx:#f4efe2;--mu:#a29b8a;--gold:#d8b565;--btn:#c9a24d;--hd:#0c0c0cee;--b1:#2a2927;--b2:#121212;--bf:#1d1d1b;--sh:#0009}
*{box-sizing:inherit;margin:0}html{scroll-padding-top:70px}
body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hd);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.w{max-width:1100px;margin:0 auto;padding:0 16px}
.hd{display:flex;align-items:center;justify-content:space-between;height:60px;gap:6px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.1em;font-size:14px;white-space:nowrap}.logo img{height:34px;width:34px;border-radius:50%;object-fit:cover}
nav{display:none;gap:24px}nav a{color:var(--mu)}nav a:hover{color:var(--tx)}
.ic{position:relative;min-width:44px;height:44px;border:0;background:none;font-size:20px;cursor:pointer;display:inline-block;line-height:44px;text-align:center}
.cnt{position:absolute;top:4px;right:2px;background:var(--btn);color:#fff;border-radius:9px;font-size:11px;font-weight:700;min-width:18px;height:18px;line-height:18px;text-align:center}
.eyebrow{color:var(--gold);letter-spacing:.3em;font-size:12px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:12px;border:1px solid var(--btn);background:var(--btn);color:#fff;font-weight:700;cursor:pointer}
.btn.o{background:none;color:var(--tx);border-color:var(--line)}.btn.b{width:100%}.btn[disabled]{opacity:.45;cursor:not-allowed}
h2{font-size:24px;margin:32px 0 16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.c{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 6px 20px var(--sh)}
.bt{aspect-ratio:1/1;background:radial-gradient(circle at 50% 30%,var(--b1),var(--b2));display:flex;align-items:center;justify-content:center;overflow:hidden}
.bt svg{width:38%;transition:transform .3s}.bt img{width:100%;height:100%;object-fit:cover}.c:hover .bt svg{transform:scale(1.06)}
.bb{fill:var(--bf);stroke:var(--gold);stroke-width:1.5}.bc{fill:var(--gold)}
.ci{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}.ci .n{font-weight:600;font-size:15px;line-height:1.25}
.tag{font-size:11px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase}.pr{font-size:17px;font-weight:700}.vl{font-size:13px;color:var(--mu)}
.ci .btn{min-height:44px;margin-top:auto;padding:0 10px;font-size:14px}
.tools{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;min-height:46px}
.row{display:flex;gap:8px}
.cart{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:10px;align-items:center}
.cart .bt{width:64px;height:64px;aspect-ratio:auto;border-radius:12px;flex:none}.cart .bt svg{width:50%}
.qty{display:inline-flex;align-items:center;gap:6px;margin-top:6px}.qty button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:none;font-size:18px;cursor:pointer}
.chip{min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:none;cursor:pointer}.chip.on{background:var(--btn);border-color:var(--btn);color:#fff}
.sum{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:16px}
.sum div{display:flex;justify-content:space-between;margin-bottom:10px}
.pd{display:grid;gap:20px;margin-top:20px}.pd .bt{border-radius:20px}.pd .bt svg{width:30%}
.empty{text-align:center;padding:60px 0;color:var(--mu)}.empty .big{font-size:64px}
.tab{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tab a{flex:1;text-align:center;padding:14px 0;color:var(--mu);font-size:13px}.tab a.on{color:var(--gold)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(86px + env(safe-area-inset-bottom,0px));background:#111;color:#fff;border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:9;animation:up .25s}
.toast a{color:#6fd3a0;font-weight:700}
@keyframes up{from{transform:translateY(12px);opacity:0}}
.md{position:fixed;inset:0;background:#000c;z-index:10;display:flex;align-items:flex-end;justify-content:center}
.md>div{background:var(--bg);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:520px;max-height:92vh;overflow:auto;display:grid;gap:10px}
.md .btn{margin-top:8px}.err{color:#d64545;font-size:14px}.note{color:var(--mu);font-size:13px}
.soc{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.soc a{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:22px;font-size:14px;background:var(--card)}.soc i{font-style:normal;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--btn);color:#fff;font-size:11px;font-weight:700}
footer{border-top:1px solid var(--line);margin-top:48px;padding:24px 0;color:var(--mu);font-size:14px}
.hero2{padding:56px 0 24px}.hero2 h1{font-size:clamp(40px,11vw,84px);line-height:1;letter-spacing:-.03em;font-weight:800}
.hero2 p{color:var(--mu);font-size:18px;margin:18px 0 28px;max-width:440px}.hero2 .row{flex-wrap:wrap}
.cats{display:grid;gap:12px;margin-top:24px}.cat{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:28px 22px;display:flex;justify-content:space-between;align-items:center;font-size:22px;font-weight:700}
.cat span{color:var(--mu);font-size:14px;font-weight:500;display:block}.cat i{font-style:normal;font-size:26px;color:var(--gold)}

function home(){const n=g=>P.filter(p=>p.g==g).length;return `<section class="hero2"><div><div class="eyebrow">${t('eyebrow')}</div><h1>${t('h1')}</h1><p>${t('hp')}</p><div class="row" style="flex-wrap:wrap"><a class="btn" href="#/catalog">${t('catb')}</a><a class="btn o" href="${WA}" target="_blank" rel="noopener">WhatsApp</a></div></div><img class="hl" src="${CFG.logo}" alt="MUSTANG PERFUME" style="order:-1"></section>${soc()}<div class="cats"><a class="cat" href="#/catalog" onclick="F.g='m'"><div>${t('cm')}<span>${n('m')} ${t('aro')}</span></div><i>→</i></a><a class="cat" href="#/catalog" onclick="F.g='u'"><div>${t('cu')}<span>${n('u')} ${t('aro')}</span></div><i>→</i></a><a class="cat gf" href="#/catalog" onclick="F.g='f'"><div>${t('cf')}<span>${n('f')} ${t('aro')}</span></div><i>→</i></a></div><h2>${t('how')}</h2><div class="steps"><div class="st"><b>01</b><span>${t('s1')}</span></div><div class="st"><b>02</b><span>${t('s2')}</span></div><div class="st"><b>03</b><span>${t('s3')}</span></div></div><div class="cta"><h2>${t('ctah')}</h2><p style="opacity:.7;margin-bottom:18px">${t('ctap')}</p><a class="btn" href="${WA}" target="_blank" rel="noopener">${t('ctab')}</a></div>`}

function list(){let a=P.filter(p=>(!F.g||p.g==F.g)&&(p.name+' '+p.al).toLowerCase().includes(F.q.trim().toLowerCase()));
if(F.s=='asc')a.sort((x,y)=>x.price-y.price);else if(F.s=='desc')a.sort((x,y)=>y.price-x.price);else if(F.s=='name')a.sort((x,y)=>x.name.localeCompare(y.name));
$('#list').innerHTML=a.length?a.map(card).join(''):'<p class="note">'+t('none')+'</p>'}
function product(slug){const p=P.find(x=>x.slug==slug);if(!p)return '<p class="empty">'+t('nf')+' <a href="#/catalog" style="color:var(--gold)">'+t('tocat')+'</a></p>';

function cartPage(){const ks=Object.keys(cart);if(!ks.length)return `<div class="empty"><div class="big"><svg class="i"><use href="#i-cart"/></svg></div><h2>${t('ce_h')}</h2><p>${t('ce_p')}</p><br><a class="btn" href="#/catalog">${t('ce_b')}</a></div>`;

const LN={ru:['RU','Русский'],kk:['KZ','Қазақша'],en:['EN','English'],ar:['AR','العربية']};

document.querySelectorAll('[data-ia]').forEach(e=>e.setAttribute('aria-label',t(e.dataset.ia)));

function sl(k){LANG=k;try{localStorage.setItem('mp_lang',k)}catch(e){}$('#lmn').hidden=true;applyLang();route(1)}
